<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payoo Home</title>
  <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
</head>
<!-- tailwind + daisyUi -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- front  -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
  *{
    font-family: "Outfit", sans-serif;

  }
</style>

<body  class="min-h-screen  max-w-md  bg-base-200 mx-auto">

  <header class="border-b-2 border-gray-300 sticky top-0  bg-base-200 z-10">
   <section class="w-11/12 mx-auto py-3 flex  justify-between items-center">

<div class="left flex gap-1">
      <div class="logo w-16">
    <img src="/assets/logo.png" alt=""></div>
        <div class="balance-info">
       <h2 class="text-2xl font-bold">$ <span id="balance">45000</span> </h2>
       <p class="text-neutral/50">Available Balance</p>
        </div>
    </div>
  <div class="right opacity-75">
<a href="/index.html" class="btn btn-soft ">
<i class="fa-solid fa-arrow-right-from-bracket"></i>
  Log Out

</a>
 </div>
 
   </section>
  </header>
<!-- buttons section -->
  <section class="w-11/12 mx-auto py-10  space-y-5">
      <h2 class="text-3xl font-bold">Welcome to pay<span class="text-primary">oo</span></h2>

      <p class="text-neutral/50 ">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

      <div class="buttons grid grid-cols-3 gap-3">

        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-1.png" alt="">
          <p>Add Money</p>
        </button>


        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-2.png" alt="">
          <p>Cashout</p>
        </button>


        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-3.png" alt="">
          <p>TransferMoney</p>
        </button>


        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-4.png" alt="">
          <p>Get Bonus</p>
        </button>

        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-5.png" alt="">
          <p>Pay Bill</p>
        </button>

        <button class="btn flex-col h-full py-4  bg-white border border-gray-200  rounded-xl">
          <img src="assets/opt-6.png" alt="">
          <p>Transactions</p>
        </button>

      </div>
  </section>

  
<!-- add money  section-->
   <section id="add-money " class="w-11/12 mx-auto  py-5 hidden " >
    <h2 class="text-xl font-bold mb-5">Add Money </h2>

      
     <div class="card bg-base-100 w-full  shadow  rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">


     <label class="label text-neutral text-lg font-semibold ">Select Bank</label>
  <select                           id="add-money-bank"                          class="select w-full bg-base-200  rounded-full">
     <option disabled selected>
          Select a Bank</option>
          <option value="DBBL">DBBL</option>
          <option value="IBBL">IBBL</option>
          <option value="City Bank">City Bank</option>
        </select>

<br>
          <label class="label text-neutral text-lg font-semibold ">Bank Account Number</label>
          <input
          id="add-bank-number"
          maxlength="11"
          minlength="11"
           type="text"
           class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit account number" />
   <br>
        <label class="label  text-neutral text-lg font-semibold">Amount to Add</label>
          <input
           id="add-money-amount"
           type="number"
           class="input rounded-full bg-base-200 w-full" 
           placeholder="Add Amount to withdraw" />
<br>
          <label class="label  text-neutral  text-lg font-semibold ">Pin Number</label>
          <input
          id="add-money-pin"
          maxlength="4"
          minlength="4"
           type="password"
           class="input rounded-full bg-base-200 w-full" 
           placeholder="Enter 4 Digit Pin number" />
  <br>
          <button 
           id ="add-money-btn"
          class="btn btn-primary  mt-4 rounded-full text-lg font-semibold">Add Money</button>

        </fieldset>
      </div>
    </div>
   </section>

<!-- CashOut  from-->
<section  id="cashout" class=" w-11/12  mx-auto py-5 hidden"> 
  <h2 class="text-xl font-bold mb-5">Cashout</h2>
  <div class="card bg-base-100 w-full  rounded-2xl">
      <div class="card-body">

        <fieldset class="fieldset">
          <label class="label text-neutral font-bold text-lg">Agent Number</label>
          <input id="cashout-number" type="text" 
          class="input rounded-full bg-base-200 w-full " 
          value="01609900742"
          maxlength="11"
          minlength="11"
          placeholder="Enyter your 11 digit number" />
 <br>
          <label class="label text-neutral font-bold ">Amount</label>
          <input id="cashout-amount" type="number" 
          value="01609900742"
          class="input rounded-full bg-base-200 w-full " 
          placeholder="Enyter amount to withdrow" />
<br>
          <label class="label text-neutral font-bold text-lg">pin Number </label>
          <input id="cashout-pin" type="pin" class="input rounded-full bg-base-200 w-full" value="1234"
          maxlength="4" 
          placeholder="Enter 4 digit pin number" />
<br>
          <button id="cashout-btn" class="btn btn-primary rounded-full mt-4">Withdraw Money</button>
        </fieldset>
      </div>
    </div>
</section>

<!-- Transfer Money -->
  <section  id="transfer" class=" w-11/12  mx-auto py-5 hidden"> 
  <h2 class="text-xl font-bold mb-5">Transfer Money</h2>
  <div class="card bg-base-100 w-full  rounded-2xl">
      <div class="card-body">

        <fieldset class="fieldset">
          <label class="label text-neutral font-bold text-lg">User Account Number</label>
          <input id="transfer-number" type="text" 
          class="input rounded-full bg-base-200 w-full " 
          value="01609900742"
          maxlength="11"
          minlength="11"
          placeholder="Enyter  11 digit number" />
 <br>
          <label class="label text-neutral font-bold text-lg">Amount</label>
          <input id="transfer-amount" type="number" 
          value="01609900742"
          class="input rounded-full bg-base-200 w-full " 
          placeholder="Enyter account to transfer" />
<br>
          <label class="label text-neutral font-bold text-lg">pin Number </label>
          <input id="transfer-pin" type="pin" class="input rounded-full bg-base-200 w-full" value="1234"
          maxlength="4" 
          placeholder="Enter 4 digit pin number" />
<br>
          <button id="send-btn" class="btn btn-primary rounded-full mt-4">Send Now</button>
        </fieldset>
      </div>
    </div>
</section>

<!-- Get Bonus -->
 <section  id="get-bonus" class=" w-11/12  mx-auto py-5 hidden "> 
  <h2 class="text-xl font-bold mb-5">Get Bonus</h2>
  <div class="card bg-base-100 w-full  rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">

          <label class="label text-neutral font-bold text-lg">Enter Bonus 
            Coupon </label>
          <input id="coupon-pin"
          type="coupon-pin"
          class="input rounded-full bg-base-200 w-full"
          value="1234"
          maxlength="4" 
          placeholder="Enter your coupon" />
<br>
          <button id="getbonus-btn" class="btn btn-primary rounded-full mt-4 text-lg">Get Bonus</button>
        </fieldset>
      </div>
    </div>
  </section>
  
  <!-- PayBill -->
   
 <section id="pay-money " class="w-11/12 mx-auto  py-5 hidden" >
    <h2 class="text-xl font-bold mb-5">Pay Bill</h2>

    <div class="card bg-base-100 w-full  shadow  rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">

     <label class="label text-neutral text-lg font-semibold ">Select To Pay</label>
  <select  id="pay-money-bank"    class="select w-full bg-base-200  rounded-full">
     <option disabled selected>
          Select a Bank</option>
          <option value="DBBL">DBBL</option>
          <option value="IBBL">IBBL</option>
          <option value="City Bank">City Bank</option>
        </select>
<br>
          <label class="label text-neutral text-lg font-semibold ">Biller Account Number</label>
          <input
          id="pay-bank-number"
          maxlength="11"
          minlength="11"
          type="text"
          class="input rounded-full bg-base-200 w-full" placeholder="Enter account number" />
   <br>
        <label class="label  text-neutral text-lg font-semibold">Amount to Pay</label>
          <input
           id="pay-money-amount"
           type="number"
           class="input rounded-full bg-base-200 w-full" 
           placeholder="Add Amount to pay" />
<br>
          <label class="label  text-neutral text-lg font-semibold ">Pin Number</label>
          <input
          id="paybill-pin"
          maxlength="4"
          minlength="4"
           type="password"
           class="input rounded-full bg-base-200 w-full" 
           placeholder="Enter 4 Digit Pin number" />
  <br>
          <button 
           id ="pay-btn"
          class="btn btn-primary  mt-4 rounded-full text-lg font-semibold">Pay Now</button>

        </fieldset>
      </div>
    </div>
   </section>

   
<!-- Transaction History -->
<section id="transaction-history" class="w-11/12 mx-auto py-5">

  <!-- Heading -->
  <div class="flex justify-between items-center mb-5">
    <h2 class="text-lg font-bold text-gray-800">
      Transaction History
    </h2>

    <button id="view-all-btn" class="text-sm text-gray-500">
      View All
    </button>
  </div>

  <!-- Transaction List -->
  <div id="transaction-list" class="space-y-3">

    <!-- Electricity Bill -->
    <div class="transaction-card flex items-center justify-between bg-white border border-gray-200 rounded-2xl p-4">

      <div class="flex items-center gap-3 min-w-0">

        <!-- Electricity Image -->
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden shrink-0">
          <img src="/assets/opt-5.png" alt="Electricity Bill"
           >
        </div>

        <div class="min-w-0">
          <h3 class="font-bold text-gray-600">Electricity Bill</h3>
          <p class="transaction-time text-xs text-gray-500 mt-1"></p>
        </div>

      </div>

      <button type="button"
        class="text-gray-500 text-2xl px-1 shrink-0"
        aria-label="Electricity bill options">
        &#8942;
      </button>

    </div>

    <!-- Bank Deposit -->
    <div class="transaction-card flex items-center justify-between bg-white border border-gray-200 rounded-2xl p-4">

      <div class="flex items-center gap-3 min-w-0">

        <!-- Bank Deposit Image -->
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden shrink-0">
          <img src="/assets/opt-5.png" alt="Bank Deposit"
              >
        </div>

        <div class="min-w-0">
          <h3 class="font-bold text-gray-600">Bank Deposit</h3>
          <p class="transaction-time text-xs text-gray-500 mt-1"></p>
        </div>

      </div>

      <button type="button"
        class="text-gray-500 text-2xl px-1 shrink-0"
        aria-label="Bank deposit options">
        &#8942;
      </button>

    </div>

    <!-- Mobile Recharge -->
    <div class="transaction-card flex items-center justify-between bg-white border border-gray-200 rounded-2xl p-4">

      <div class="flex items-center gap-3 min-w-0">

        <!-- Mobile Recharge Image -->
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden shrink-0">
          <img src="/assets/opt-5.png" alt="Mobile Recharge"
            >
        </div>

        <div class="min-w-0">
          <h3 class="font-bold text-gray-600">Mobile Recharge</h3>
          <p class="transaction-time text-xs text-gray-500 mt-1"></p>
        </div>

      </div>

      <button type="button"
        class="text-gray-500 text-2xl px-1 shrink-0"
        aria-label="Mobile recharge options">
        &#8942;
      </button>

    </div>

    <!-- Gas Bill -->
    <div class="transaction-card flex items-center justify-between bg-white border border-gray-200 rounded-2xl p-4">

      <div class="flex items-center gap-3 min-w-0">

        <!-- Gas Bill Image -->
        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden shrink-0">
          <img src="/assets/opt-5.png" alt="Gas Bill"
             >
        </div>

        <div class="min-w-0">
          <h3 class="font-bold text-gray-600">Gas Bill</h3>
          <p class="transaction-time text-xs text-gray-500 mt-1"></p>
        </div>

      </div>

      <button type="button"
        class="text-gray-500 text-2xl px-1 shrink-0"
        aria-label="Gas bill options">
        &#8942;
      </button>

    </div>

  </div>
</section>

 





<script src="script/machine.js"></script>
<script src="script/history.js"></script>

<script src="script/addmoney.js"></script>
<script src="/script/cashout.js"></script>
<script src="script/transfer.js"></script>
<script src="script/getbonus.js"></script>
<script src="script/paybilll.js"></script>


</body>
</html>
